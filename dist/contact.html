<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Us — Blue Seat Studios</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue:      #096f9c;
      --blue-dk:   #065578;
      --orange:    #f97c53;
      --orange-dk: #e05e35;
      --navy:      #0a2233;
      --muted:     #5a7282;
    }

    body {
      font-family: 'Quicksand', sans-serif;
      background: #f5f9fc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── NAV ── */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 3rem;
      height: 72px;
      background: rgba(9,111,156,0.95);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      flex-shrink: 0;
    }
    .nav-logo img { height: 56px; width: auto; display: block; }
    .nav-links { display: flex; gap: 2rem; list-style: none; align-items: center; }
    .nav-links a { color: rgba(255,255,255,0.75); text-decoration: none; font-size: 0.92rem; font-weight: 600; transition: color 0.2s; }
    .nav-links a:hover, .nav-links a.active { color: #fff; }
    .nav-cta { background: var(--orange); color: #fff !important; padding: 0.5rem 1.4rem; border-radius: 50px; font-weight: 700 !important; display: inline-flex; align-items: center; justify-content: center; line-height: 1; transition: background 0.2s, transform 0.15s; }
    .nav-cta:hover { background: var(--orange-dk) !important; transform: translateY(-1px); }

    /* ── SPLIT ── */
    .split {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 2fr;
      min-height: calc(100vh - 72px);
    }

    /* ── LEFT: illustration ── */
    .image-side {
      position: relative;
      overflow: hidden;
      background: #e8f4fb;
    }
    .image-side img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    /* ── RIGHT: form ── */
    .form-side {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 56px 64px;
      background: #fff;
    }
    .form-inner { width: 100%; max-width: 520px; }
    .form-inner h2 { font-size: 1.8rem; font-weight: 700; color: var(--navy); margin-bottom: 0.4rem; }
    .form-inner p { font-size: 0.95rem; color: var(--muted); font-weight: 500; margin-bottom: 2rem; line-height: 1.65; }
    .form-inner p a { color: var(--orange); font-weight: 700; text-decoration: none; }
    .form-inner p a:hover { text-decoration: underline; }
    .hs-form-frame { width: 100%; }

    @media (max-width: 860px) {
      .split { grid-template-columns: 1fr; }
      .image-side { display: none; }
      .form-side { padding: 48px 24px; }
    }
    @media (max-width: 768px) {
      nav { padding: 0 1.5rem; }
      .nav-links li:not(:last-child) { display: none; }
    }
  </style>
</head>
<body>

<!-- NAV -->
<nav>
  <div class="nav-logo">
    <a href="/"><img src="/assets/images/logos/blue_seat_logo_final.png" alt="Blue Seat Studios" /></a>
  </div>
  <ul class="nav-links">
    <li><a href="catalog.html?audience=workplace">Workplace</a></li>
    <li><a href="catalog.html?audience=highered">Higher Ed</a></li>
    <li><a href="catalog.html?audience=k12">K–12</a></li>
    <li><a href="catalog.html">Catalog</a></li>
    <li><a href="about-us.html">About</a></li>
    <li><a href="contact.html" class="active">Contact Us</a></li>
    <li><a href="demo.html" class="nav-cta">Demo</a></li>
  </ul>
</nav>

<div class="split">

  <!-- ILLUSTRATION -->
  <div class="image-side">
    <img src="/assets/images/ui/quote.gif" alt="Blue Seat Studios illustration" />
  </div>

  <!-- FORM -->
  <div class="form-side">
    <div class="form-inner">
      <h2>Let's work together.</h2>
      <p>Tell us about your organization and what you're looking for — we'll get back to you within 1–2 business days. Or email us directly at <a href="mailto:hello@blueseatstudios.com">hello@blueseatstudios.com</a>.</p>
      <script src="https://js.hsforms.net/forms/embed/44723819.js" defer></script>
      <div class="hs-form-frame" data-region="na1" data-form-id="88e25183-eabc-4455-970d-156cd631f03f" data-portal-id="44723819"></div>
    </div>
  </div>

</div>

</body>
</html>
