<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Get Demo Access — Blue Seat Studios</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue:      #096f9c;
      --blue-dk:   #065578;
      --orange:    #f97c53;
      --orange-dk: #e05e35;
    }

    body {
      font-family: 'Quicksand', sans-serif;
      background: #f5f9fc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── NAV (matches catalog) ── */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 3rem;
      height: 72px;
      background: rgba(9, 111, 156, 0.95);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      flex-shrink: 0;
    }

    .nav-logo img { height: 56px; width: auto; display: block; }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
      align-items: center;
    }

    .nav-links a {
      color: rgba(255,255,255,0.75);
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 600;
      transition: color 0.2s;
    }

    .nav-links a:hover, .nav-links a.active { color: #fff; }

    .nav-cta {
      background: var(--orange);
      color: #fff !important;
      padding: 0.5rem 1.4rem;
      border-radius: 50px;
      font-weight: 700 !important;
      transition: background 0.2s, transform 0.15s !important;
    }
    .nav-cta:hover { background: var(--orange-dk) !important; transform: translateY(-1px); }

    @media (max-width: 768px) {
      .nav-links li:not(:last-child) { display: none; }
      nav { padding: 0 1.5rem; }
    }

    /* ── MAIN SPLIT ── */
    .split {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 2fr;
      min-height: calc(100vh - 72px);
    }

    /* ── LEFT: form ── */
    .form-side {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 56px 64px;
      background: #fff;
    }

    .form-inner {
      width: 100%;
      max-width: 420px;
    }

    .hs-form-frame { width: 100%; }

    /* ── RIGHT: image ── */
    .image-side {
      position: relative;
      overflow: hidden;
    }

    .image-side img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      padding: 0;
    }

    .image-side::after {
      display: none;
    }

    @media (max-width: 860px) {
      .split { grid-template-columns: 1fr; }
      .image-side { display: none; }
      .form-side { padding: 48px 24px; }
    }
  </style>
</head>
<body>

<nav id="main-nav">
  <div class="nav-logo">
    <a href="/"><img src="/assets/images/logos/blue_seat_logo_final.png" alt="Blue Seat Studios" /></a>
  </div>
  <div class="nav-right">
    <ul class="nav-links">
      <li><a href="catalog.html">Full Catalog</a></li>
      <li><a href="about-us.html">About</a></li>
      <li><a href="contact.html" class="nav-cta">Contact Us</a></li>
    </ul>
  </div>
</nav>

<div class="split">

  <div class="image-side">
    <img
      src="/assets/images/ui/demo-illustration.png"
      alt="Good news illustration"
    />
  </div>

  <div class="form-side">
    <div class="form-inner">
      <script src="https://js.hsforms.net/forms/embed/44723819.js" defer></script>
      <div class="hs-form-frame" data-region="na1" data-form-id="f515dae4-42d8-4206-928c-2951f4681d69" data-portal-id="44723819"></div>
    </div>
  </div>

</div>

</body>
</html>
